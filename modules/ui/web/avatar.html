<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>MacAssistant Futuristic AI Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* Subtle futuristic holographic scanlines & ambient vignette */
    .hologram-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 40%, rgba(0, 240, 255, 0.03) 0%, transparent 75%);
    }

    /* Ambient cybernetic rings at avatar base */
    #hud-status-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 10px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(0, 245, 255, 0.75);
      background: rgba(10, 20, 35, 0.45);
      border: 1px solid rgba(0, 245, 255, 0.25);
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.15);
      opacity: 0;
      transition: opacity 0.4s ease, border-color 0.4s ease, color 0.4s ease;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/",
      "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
    }
  }
  </script>
</head>

<body>
  <div id="canvas-container"></div>
  <div class="hologram-hud"></div>
  <div id="hud-status-badge">AI ONLINE</div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let currentVrm = null;
    let scene, camera, renderer, clock;

    // Animation States: idle, listening, thinking, speaking, notification, error, sleeping
    let avatarState = 'idle';
    let animationStyle = 'futuristic'; // futuristic | realistic

    // Facial morph target state
    let targetMouthOpen = 0.0;
    let currentMouthOpen = 0.0;
    let targetVowel = 'aa';
    let currentExpression = 'neutral';

    // Blinking
    let lastBlinkTime = 0;
    let isBlinking = false;
    let blinkDuration = 0.16;
    let blinkTimer = 0;

    // Power saving & Frame pacing
    let targetFps = 30; // 30fps default, 15fps sleeping, 60fps speaking
    let lastRenderTime = 0;
    let isSleeping = false;

    // Futuristic 3D holographic elements
    let holoRingGroup = null;
    let holoRingOuter = null;
    let holoRingInner = null;
    let statusBadge = null;

    function init() {
      const container = document.getElementById('canvas-container');
      statusBadge = document.getElementById('hud-status-badge');
      const width = window.innerWidth;
      const height = window.innerHeight;

      clock = new THREE.Clock();
      scene = new THREE.Scene();

      // Transparent WebGL Renderer
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      // Camera positioned for conversational portrait
      camera = new THREE.PerspectiveCamera(28, width / height, 0.1, 20.0);
      camera.position.set(0.0, 1.35, 1.55);
      camera.lookAt(0.0, 1.30, 0.0);

      // Sophisticated Sci-Fi 3-point lighting setup
      // Key light (crisp white)
      const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
      keyLight.position.set(1.2, 2.2, 1.6).normalize();
      scene.add(keyLight);

      // Ambient fill (soft ambient)
      const ambLight = new THREE.AmbientLight(0xf2f7ff, 0.9);
      scene.add(ambLight);

      // Futuristic Rim / Accent light (cyan / electric blue)
      const rimLight = new THREE.DirectionalLight(0x00d4ff, 1.3);
      rimLight.position.set(-1.8, 1.5, -1.2).normalize();
      scene.add(rimLight);

      // Under-glow spotlight (holographic pedestal reflection)
      const underLight = new THREE.PointLight(0x00ffff, 0.7, 3.0);
      underLight.position.set(0.0, 0.3, 0.4);
      scene.add(underLight);

      createFuturisticHoloElements();

      window.addEventListener('resize', onResize);
      animate();
    }

    function createFuturisticHoloElements() {
      holoRingGroup = new THREE.Group();
      holoRingGroup.position.set(0.0, 0.85, 0.0);

      // Outer ring
      const ringGeomOuter = new THREE.RingGeometry(0.55, 0.57, 64);
      const ringMatOuter = new THREE.MeshBasicMaterial({
        color: 0x00f0ff,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide
      });
      holoRingOuter = new THREE.Mesh(ringGeomOuter, ringMatOuter);
      holoRingOuter.rotation.x = Math.PI / 2;
      holoRingGroup.add(holoRingOuter);

      // Inner segmented ring
      const ringGeomInner = new THREE.RingGeometry(0.48, 0.495, 32);
      const ringMatInner = new THREE.MeshBasicMaterial({
        color: 0x7000ff,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide
      });
      holoRingInner = new THREE.Mesh(ringGeomInner, ringMatInner);
      holoRingInner.rotation.x = Math.PI / 2;
      holoRingGroup.add(holoRingInner);

      scene.add(holoRingGroup);
    }

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.loadVRM = function (vrmUrl, scale = 1.0) {
      console.log("Loading VRM model:", vrmUrl);
      const loader = new GLTFLoader();
      loader.crossOrigin = 'anonymous';
      loader.register((parser) => new VRMLoaderPlugin(parser));

      loader.load(
        vrmUrl,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          if (currentVrm) {
            scene.remove(currentVrm.scene);
            VRMUtils.deepDispose(currentVrm.scene);
          }
          currentVrm = vrm;
          scene.add(vrm.scene);
          VRMUtils.rotateVRM0(vrm);

          vrm.scene.scale.set(scale, scale, scale);
          vrm.scene.position.set(0.0, 0.0, 0.0);

          // Focus camera dynamically on model's head
          if (vrm.humanoid) {
            const head = vrm.humanoid.getNormalizedBoneNode('head');
            if (head) {
              const headPos = new THREE.Vector3();
              head.getWorldPosition(headPos);
              camera.position.set(headPos.x, headPos.y + 0.02, 1.35);
              camera.lookAt(headPos.x, headPos.y - 0.03, 0.0);
              if (holoRingGroup) {
                holoRingGroup.position.set(headPos.x, headPos.y - 0.55, 0.0);
              }
            }
          }

          // Initial expression
          window.setState('idle');
          console.log("VRM model loaded and ready.");
        },
        undefined,
        (error) => {
          console.error("VRM loading failed:", error);
        }
      );
    };

    window.setState = function (state) {
      avatarState = state;
      isSleeping = (state === 'sleeping');
      console.log("Avatar state updated:", state);

      if (statusBadge) {
        statusBadge.textContent = state.toUpperCase();
        statusBadge.style.opacity = (state === 'idle') ? '0' : '0.85';
      }

      switch (state) {
        case 'listening':
          targetFps = 45;
          setExpression('surprised', 0.6);
          updateHoloColor(0x00f0ff, 0.7);
          break;
        case 'thinking':
          targetFps = 30;
          setExpression('neutral', 1.0);
          updateHoloColor(0x9d00ff, 0.6);
          break;
        case 'speaking':
          targetFps = 60;
          setExpression('happy', 0.45);
          updateHoloColor(0x00ffcc, 0.85);
          break;
        case 'notification':
          targetFps = 45;
          setExpression('surprised', 0.7);
          updateHoloColor(0xffd700, 0.9);
          break;
        case 'error':
          targetFps = 30;
          setExpression('sad', 0.8);
          updateHoloColor(0xff2a6d, 0.9);
          break;
        case 'sleeping':
          targetFps = 15; // Low power sleep mode
          setExpression('neutral', 0.0);
          updateHoloColor(0x005577, 0.2);
          break;
        case 'idle':
        default:
          targetFps = 30;
          setExpression('neutral', 1.0);
          updateHoloColor(0x00f0ff, 0.35);
          targetMouthOpen = 0.0;
          break;
      }
    };

    function updateHoloColor(hex, opacity) {
      if (holoRingOuter && holoRingOuter.material) {
        holoRingOuter.material.color.setHex(hex);
        holoRingOuter.material.opacity = opacity;
      }
      if (statusBadge) {
        statusBadge.style.color = '#' + hex.toString(16).padStart(6, '0');
        statusBadge.style.borderColor = '#' + hex.toString(16).padStart(6, '0') + '55';
      }
    }

    window.setAmplitude = function (amplitude, vowel = 'aa') {
      targetMouthOpen = Math.min(1.0, Math.max(0.0, amplitude));
      targetVowel = vowel;
    };

    window.setExpression = function (name, weight = 1.0) {
      currentExpression = name;
      if (!currentVrm || !currentVrm.expressionManager) return;
      const em = currentVrm.expressionManager;
      ['happy', 'surprised', 'neutral', 'relaxed', 'sad', 'angry'].forEach(exp => {
        try {
          em.setValue(exp, exp === name ? weight : 0.0);
        } catch (e) { }
      });
    };

    function updateExpressions(delta, elapsed) {
      if (!currentVrm || !currentVrm.expressionManager) return;
      const em = currentVrm.expressionManager;

      // Smooth mouth interpolation
      currentMouthOpen += (targetMouthOpen - currentMouthOpen) * Math.min(1.0, delta * 24.0);

      // Reset all vowel blendshapes
      ['aa', 'ih', 'ou', 'ee', 'oh'].forEach(v => {
        try { em.setValue(v, 0.0); } catch (e) { }
      });

      if (avatarState === 'speaking' && currentMouthOpen > 0.02) {
        try {
          em.setValue(targetVowel, currentMouthOpen);
        } catch (e) {
          try { em.setValue('aa', currentMouthOpen); } catch (e2) { }
        }
      }

      // Sleeping: keep eyes closed
      if (isSleeping) {
        try { em.setValue('blink', 1.0); } catch (e) { }
        em.update();
        return;
      }

      // Natural eye blinking
      if (!isBlinking && (elapsed - lastBlinkTime > 2.8 + Math.random() * 2.5)) {
        isBlinking = true;
        blinkTimer = 0;
        lastBlinkTime = elapsed;
      }

      if (isBlinking) {
        blinkTimer += delta;
        const half = blinkDuration / 2.0;
        let blinkWeight = 0.0;
        if (blinkTimer < half) {
          blinkWeight = blinkTimer / half;
        } else if (blinkTimer < blinkDuration) {
          blinkWeight = 1.0 - (blinkTimer - half) / half;
        } else {
          isBlinking = false;
          blinkWeight = 0.0;
        }
        try { em.setValue('blink', blinkWeight); } catch (e) { }
      }

      em.update();
    }

    function updateHumanoid(delta, elapsed) {
      if (!currentVrm || !currentVrm.humanoid) return;
      const h = currentVrm.humanoid;
      const spine = h.getNormalizedBoneNode('spine');
      const head = h.getNormalizedBoneNode('head');

      // Breathing motion
      const breathSpeed = isSleeping ? 0.9 : (avatarState === 'speaking' ? 2.5 : 1.6);
      const breathAmp = isSleeping ? 0.012 : 0.022;
      const breath = Math.sin(elapsed * breathSpeed) * breathAmp;
      if (spine) {
        spine.rotation.x = breath;
      }

      // State-specific micro head movement
      if (head) {
        if (avatarState === 'sleeping') {
          // Head relaxed downwards
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, 0.16, delta * 2.0);
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, 0.0, delta * 2.0);
          head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, 0.05, delta * 2.0);
        } else if (avatarState === 'listening') {
          // Attentive tilt forward & toward user
          head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, 0.08, delta * 5.0);
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, -0.05, delta * 5.0);
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, 0.0, delta * 5.0);
        } else if (avatarState === 'thinking') {
          // Contemplative look up and slightly away
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, 0.14, delta * 3.5);
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, -0.08, delta * 3.5);
          head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, -0.03, delta * 3.5);
        } else if (avatarState === 'speaking') {
          // Conversational cadence nods & sway
          const nod = Math.sin(elapsed * 5.5) * 0.035;
          const sway = Math.cos(elapsed * 2.8) * 0.02;
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, nod, delta * 8.0);
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, sway, delta * 8.0);
        } else if (avatarState === 'notification') {
          // Quick attentive snap
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, -0.06, delta * 6.0);
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, 0.0, delta * 6.0);
        } else if (avatarState === 'error') {
          // Subtle shake side to side
          const shake = Math.sin(elapsed * 8.0) * 0.04;
          head.rotation.y = shake;
          head.rotation.x = 0.05;
        } else {
          // Gentle idle drift
          const idleX = Math.sin(elapsed * 0.8) * 0.02;
          const idleY = Math.sin(elapsed * 0.5) * 0.035;
          head.rotation.x = THREE.MathUtils.lerp(head.rotation.x, idleX, delta * 2.0);
          head.rotation.y = THREE.MathUtils.lerp(head.rotation.y, idleY, delta * 2.0);
          head.rotation.z = THREE.MathUtils.lerp(head.rotation.z, 0.0, delta * 2.0);
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const interval = 1000 / targetFps;
      if (now - lastRenderTime < interval) return;
      lastRenderTime = now - ((now - lastRenderTime) % interval);

      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      // Animate holographic rings
      if (holoRingGroup) {
        if (holoRingOuter) holoRingOuter.rotation.z += delta * 0.4;
        if (holoRingInner) holoRingInner.rotation.z -= delta * 0.7;
      }

      if (currentVrm) {
        updateExpressions(delta, elapsed);
        updateHumanoid(delta, elapsed);
        currentVrm.update(delta);
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>

</html>
